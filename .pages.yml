media:
  input: images
  output: /images

content:
  - name: carousel
    label: 🖼️ Homepage Gallery Carousel
    type: file
    path: data/carousel.json
    list: true
    fields:
      - name: title
        label: Slide Title / Caption
        type: string
      - name: image
        label: Slide Photo (Drag & Drop)
        type: image

  - name: team
    label: 👥 Meet the Team
    type: file
    path: data/team.json
    list: true
    fields:
      - name: name
        label: Committee / Member Title
        type: string
      - name: members
        label: Member Names (e.g. Ritesh, David)
        type: string
      - name: photo
        label: Photo (Drag & Drop)
        type: image
      - name: bio
        label: Description / Bio
        type: text

  - name: reports
    label: 📰 Post-Trip Reports
    type: file
    path: data/reports.json
    list: true
    fields:
      - name: title
        label: Report Title
        type: string
      - name: year
        label: Year / Date
        type: string
      - name: cover
        label: Cover Photo (Drag & Drop)
        type: image
      - name: pdf_link
        label: PDF Link or Document
        type: string
      - name: description
        label: Summary / Details
        type: text

  - name: site_info
    label: ⚙️ Website Details & Contact
    type: file
    path: data/site_info.json
    fields:
      - name: site_title
        label: Site Title
        type: string
      - name: contact_email
        label: Contact Email
        type: string
      - name: instagram_handle
        label: Instagram Handle
        type: string
      - name: footer_copyright
        label: Footer Copyright Text
        type: string
