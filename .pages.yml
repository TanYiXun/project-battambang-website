media:
  input: images
  output: /images

content:
  - name: home
    label: Home Page
    type: file
    path: content/home.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - name: hero
        label: Hero Banner
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: description, label: Description, type: text }
          - { name: button_text, label: Button Text, type: string }
      - name: roots
        label: Our Roots Section
        type: object
        fields:
          - { name: title, label: Section Title, type: string }
          - { name: story, label: Our Story, type: text }
      - name: vision_mission
        label: Vision & Mission Section
        type: object
        fields:
          - { name: vision, label: Our Vision, type: text }
          - { name: mission, label: Our Mission, type: text }
      - name: values
        label: Core Values (LIBRAS)
        type: list
        fields:
          - { name: name, label: Value Name, type: string }
          - { name: description, label: Description, type: text }
      - name: initiatives
        label: Featured Initiatives Cards
        type: list
        fields:
          - { name: title, label: Initiative Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Cover Image, type: image }
          - { name: link, label: Target Page Link, type: string }

  - name: team
    label: Meet the Team Page
    type: file
    path: content/team.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - { name: hero_image, label: Full Committee Group Photo, type: image }
      - name: members
        label: Sub-Committees & Members List
        type: list
        fields:
          - { name: name, label: Committee / Member Name, type: string }
          - { name: role, label: Role / Subtitle, type: string }
          - { name: bio, label: Biography / Description, type: text }
          - { name: image, label: Photo, type: image }

  - name: support
    label: Health Screening Page
    type: file
    path: content/support.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - name: stats
        label: Impact Statistics
        type: list
        fields:
          - { name: label, label: Stat Label, type: string }
          - { name: value, label: Stat Value, type: string }
      - name: areas
        label: Operational Areas
        type: list
        fields:
          - { name: title, label: Area Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Area Image, type: image }

  - name: education
    label: Education Outreach Page
    type: file
    path: content/education.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - name: programmes
        label: Education Programmes
        type: list
        fields:
          - { name: title, label: Programme Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Image, type: image }

  - name: development
    label: Development Page
    type: file
    path: content/development.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - { name: hero_image, label: Hero Banner Image, type: image }
      - name: projects
        label: Development Initiatives
        type: list
        fields:
          - { name: title, label: Initiative Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Image, type: image }
      - name: future_outlook
        label: Future Outlook Section
        type: object
        fields:
          - { name: title, label: Section Title, type: string }
          - { name: description, label: Description, type: text }

  - name: reports
    label: Post-Trip Reports Page
    type: file
    path: content/reports.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - name: reports
        label: Annual Trip Reports
        type: list
        fields:
          - { name: title, label: Report Title, type: string }
          - { name: summary, label: Summary, type: text }
          - { name: image, label: Cover Image, type: image }
          - { name: pdf, label: PDF / Link URL, type: string }

  - name: get_involved
    label: Get Involved Page
    type: file
    path: content/get-involved.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - name: opportunities
        label: Involvement Opportunities
        type: list
        fields:
          - { name: title, label: Opportunity Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: button_text, label: Button Text, type: string }
          - { name: link, label: Button Link, type: string }

  - name: donation
    label: Donations Page
    type: file
    path: content/donation.json
    fields:
      - { name: page_title, label: Page Title, type: string }
      - { name: intro_text, label: Intro Text, type: text }
      - name: paynow
        label: PayNow Donation Section
        type: object
        fields:
          - { name: title, label: Section Title, type: string }
          - { name: instructions, label: Instructions, type: text }
          - { name: qr_code_image, label: PayNow QR Code Image, type: image }
      - name: cheque
        label: Cheque Donation Section
        type: object
        fields:
          - { name: title, label: Section Title, type: string }
          - { name: instructions, label: Instructions, type: text }
      - { name: contact_email, label: Contact Email, type: string }

  - name: header_footer
    label: Header & Footer
    type: file
    path: content/header_footer.json
    fields:
      - { name: site_title, label: Site Title, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: logo_image, label: Logo Image, type: image }
      - { name: contact_email, label: Contact Email, type: string }
      - { name: copyright_text, label: Copyright Text, type: string }
