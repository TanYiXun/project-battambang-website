media:
  input: images
  output: /images

content:
  - name: home_page
    label: 🏠 Home Page (À La Carte Builder)
    type: file
    path: content/home.json
    fields:
      - name: page_title
        label: Page Title
        type: string
      - name: sections
        label: 🧩 Page Sections (Add & Re-order À La Carte Blocks)
        type: block
        list: true
        blocks:
          - name: hero_banner
            label: 🖼️ Hero Slideshow / Banner
            fields:
              - name: title
                label: Banner Title
                type: string
              - name: slides
                label: Slide Photos (Drag & Drop)
                type: object
                list: true
                fields:
                  - name: title
                    label: Slide Title
                    type: string
                  - name: image
                    label: Photo (Drag & Drop)
                    type: image

          - name: text_block
            label: 📝 Text & Paragraph Block
            fields:
              - name: title
                label: Heading
                type: string
              - name: text
                label: Description / Body Text
                type: text

          - name: cards_grid
            label: 📇 Feature Cards Grid (2 or 3 Columns)
            fields:
              - name: section_title
                label: Section Heading
                type: string
              - name: items
                label: Cards List
                type: object
                list: true
                fields:
                  - name: title
                    label: Card Title
                    type: string
                  - name: photo
                    label: Photo (Drag & Drop)
                    type: image
                  - name: text
                    label: Description
                    type: text
                  - name: link
                    label: Button Link URL
                    type: string

          - name: image_gallery
            label: 📷 Photo Gallery Block
            fields:
              - name: section_title
                label: Gallery Title
                type: string
              - name: photos
                label: Photos List
                type: object
                list: true
                fields:
                  - name: image
                    label: Photo (Drag & Drop)
                    type: image
                  - name: caption
                    label: Caption
                    type: string

          - name: call_to_action
            label: 💙 Call-to-Action / Donation Block
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Text Description
                type: text
              - name: button_text
                label: Button Text
                type: string
              - name: button_link
                label: Button Link URL
                type: string
              - name: qr_image
                label: PayNow / QR Photo (Drag & Drop)
                type: image

          - name: faq_accordion
            label: ❓ FAQ / Accordion
            fields:
              - name: section_title
                label: FAQ Heading
                type: string
              - name: items
                label: Q&A List
                type: object
                list: true
                fields:
                  - name: question
                    label: Question
                    type: string
                  - name: answer
                    label: Answer
                    type: text

