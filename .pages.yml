media:
  input: images
  output: /images

content:
  # Structured GUI Form Editors
  - name: carousel
    label: 🖼️ Homepage Gallery Carousel
    type: file
    path: data/carousel.json
    list: true
    fields:
      - name: title
        label: Slide Title / Caption
        type: string
      - name: image
        label: Slide Photo (Drag & Drop)
        type: image

  - name: team_data
    label: 👥 Meet the Team Data
    type: file
    path: data/team.json
    list: true
    fields:
      - name: name
        label: Committee / Member Title
        type: string
      - name: members
        label: Member Names (e.g. Ritesh, David)
        type: string
      - name: photo
        label: Photo (Drag & Drop)
        type: image
      - name: bio
        label: Description / Bio
        type: text

  - name: reports_data
    label: 📰 Post-Trip Reports Data
    type: file
    path: data/reports.json
    list: true
    fields:
      - name: title
        label: Report Title
        type: string
      - name: year
        label: Year / Date
        type: string
      - name: cover
        label: Cover Photo (Drag & Drop)
        type: image
      - name: pdf_link
        label: PDF Link or Document
        type: string
      - name: description
        label: Summary / Details
        type: text

  - name: site_info
    label: ⚙️ Website Details & Contact
    type: file
    path: data/site_info.json
    fields:
      - name: site_title
        label: Site Title
        type: string
      - name: contact_email
        label: Contact Email
        type: string
      - name: instagram_handle
        label: Instagram Handle
        type: string
      - name: footer_copyright
        label: Footer Copyright Text
        type: string

  # Full Site HTML Pages
  - name: home_page
    label: 📄 Home Page (index.html)
    type: file
    path: index.html

  - name: team_page
    label: 📄 Meet the Team (meet-the-team.html)
    type: file
    path: meet-the-team.html

  - name: donation_page
    label: 📄 Donation Page (services-4.html)
    type: file
    path: services-4.html

  - name: reports_page
    label: 📄 Post-Trip Reports (post-trip-reports.html)
    type: file
    path: post-trip-reports.html

  - name: education_page
    label: 📄 Education Outreach (education-outreach.html)
    type: file
    path: education-outreach.html

  - name: support_page
    label: 📄 Support Services (support-services.html)
    type: file
    path: support-services.html
